name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: input
    id: version
    attributes: {label: Version, description: "Help ▸ About Congegno, e.g. 0.0.1-m6.1", placeholder: 0.0.1-m6.1}
    validations: {required: true}
  - type: dropdown
    id: system
    attributes: {label: System, options: [macOS Apple Silicon, macOS Intel, Linux x86_64, Linux aarch64, Other]}
    validations: {required: true}
  - type: textarea
    id: what
    attributes: {label: What happened, description: What you did, what you expected, what happened instead. Error messages and codes (CGN-…) verbatim.}
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: How to reproduce it, description: Steps, or a small model that shows it (attach the .cgn). Only share what you are free to share.}
